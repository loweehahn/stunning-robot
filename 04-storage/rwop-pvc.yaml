# API version for core objects such as PersistentVolumeClaims.
apiVersion: v1
# The type of object to create.
kind: PersistentVolumeClaim
# Identifying data for the claim.
metadata:
  name: rwop-pvc
# The storage being requested; the default StorageClass provisions a PV for it.
spec:
  # Can be used by a single Pod across the whole cluster (needs a CSI driver that supports it).
  accessModes:
  - ReadWriteOncePod
  # The minimum amount of storage required.
  resources:
    requests:
      storage: 100Mi
