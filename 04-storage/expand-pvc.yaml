# API version for core objects such as PersistentVolumeClaims.
apiVersion: v1
# The type of object to create.
kind: PersistentVolumeClaim
# Identifying data for the claim.
metadata:
  name: expand-pvc
# The storage being requested, provisioned through the class that allows expansion.
spec:
  # Can be mounted read-write by a single node at a time.
  accessModes:
  - ReadWriteOnce
  # The StorageClass to use, so the claim can later request a larger size.
  storageClassName: local-path-expand
  # The minimum amount of storage required.
  resources:
    requests:
      storage: 100Mi
