# API version for core objects such as PersistentVolumeClaims.
apiVersion: v1
# The type of object to create.
kind: PersistentVolumeClaim
# Identifying data for the claim.
metadata:
  name: retain-pvc
# The storage being requested, provisioned through the Retain class.
spec:
  # Can be mounted read-write by a single node at a time.
  accessModes:
  - ReadWriteOnce
  # The StorageClass to use, so the PV keeps its data when this claim is deleted.
  storageClassName: local-path-retain
  # The minimum amount of storage required.
  resources:
    requests:
      storage: 100Mi
