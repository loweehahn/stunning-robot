# API version for core objects such as Pods.
apiVersion: v1
# The type of object to create.
kind: Pod
# Identifying data for the Pod.
metadata:
  name: rwop-2
# The desired state of the Pod.
spec:
  # The containers that run inside the Pod.
  containers:
  - name: nginx
    image: nginx:1.27
    # CPU and memory reserved (requests) and capped (limits) for the container.
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
    # Where the Pod's volumes appear inside this container's filesystem.
    volumeMounts:
    - name: data
      mountPath: /data
  # Storage backed by the PVC, which only one Pod in the cluster may use at a time (the claim must exist in the same namespace).
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: rwop-pvc
