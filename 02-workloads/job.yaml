apiVersion: batch/v1
kind: Job
metadata:
  name: job-test
spec:
  template:
    metadata:
      labels:
        app: job-test
    spec:
      containers:
      - name: hello
        image: busybox:1.36
        command: ["echo", "Hello from a Job"]
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
      restartPolicy: Never
  backoffLimit: 4
